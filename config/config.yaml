# Virotrace base configuration.
# Every analytical parameter lives here. See docs/06-configuration.md.
version: 1
schema_version: 1

scope: kenya
seed: 20261104
threads: 4
snapshot_id: null

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reference: config/reference
  results: results
  auspice: auspice
  reports: reports

scopes:
  kenya:
    countries: [KEN]
    regions: []
  africa:
    countries: []
    regions: [eastern_africa, southern_africa, western_africa, middle_africa, northern_africa]

reference:
  accession: K03455
  record: hxb2.gb
  genes:
    # HXB2 nucleotide coordinates, 1-based inclusive.
    # pol spans 2085-5096 including its terminal stop codon (1004 codons).
    # Integrase is often quoted as 4230-5096, which is 289 codons because it
    # includes that stop. The coding range for the 288-aa protein ends at 5093.
    pol: [2085, 5096]
    pr: [2253, 2549]
    rt: [2550, 4229]
    in: [4230, 5093]

acquire:
  # LANL has no query API: add `lanl` after putting its FASTA downloads in lanl_path.
  sources: [genbank]
  lanl_path: data/external/lanl
  fixture_path: tests/fixtures/records_toy.tsv   # used when sources includes 'fixture'
  min_length: 1000
  max_length: 10000
  extra_term: null              # extra Entrez clause ANDed onto the query (see docs/03)
  email: null
  retries: 3
  cache: true

curate:
  dates:
    min_year: 1985
    max_year: 2026
    allow_year_only: true
  geo:
    country_lookup: country_map.tsv
    require_admin1: false
  dedup:
    identity_threshold: 1.0
    collapse_strategy: keep_best_coverage

qc:
  min_gene_coverage: 0.80
  max_ambiguity_frac: 0.05
  exclude_internal_stop: true
  exclude_frameshift: true
  hypermutation:
    enabled: true
    p_threshold: 0.05
    action: exclude
  min_identity_to_reference: 0.75   # below this a sequence is not pol (see qc_summary.json)
  min_class_position_coverage: 1.0  # share of a class's SDRM positions that must be covered
  exclude_lab_strains: true
  lab_strain_list: lab_strains.txt
  individual_policy: one_per_individual   # keep_all | one_per_individual (see docs)
  individual_id_patterns:   # regexes on the isolate name; group 1 = person id; first match wins
    - '^RV217_(\d+)_'            # Rossenkhan: RV217_20225_v01_GP_1_90 -> 20225
    - '^(\d{5})v\d+_\d+$'        # Rolland, Lewitus, etc.: 20225v09_09 -> 20225 (same RV217 id space)
    - '^(V\d+_\d+)_\d+_GP_'      # Mullins: V703_0865_070_GP_1_64 -> V703_0865 (assumed participant)
    - '^(\d{2}KE\d+)pol\.M\d+$'   # PMID:27403940: 00KE170pol.M3 -> 00KE170 (months = visits)
    - '^(\d{5})_\d{1,2}-[A-Z]{3}-\d{4}$'   # PMID:29293156: 64000_9-FEB-2012 -> 64000 (date = visit)
    - '^(ACTG\d+_\d+)_\d+_PR_RT$'   # PMID:31724034: ACTG5288_40_1_PR_RT -> ACTG5288_40 (_1/_2 = repeat sequences)
  clone_policy: exclude          # exclude | keep_all; see docs/06-configuration.md
  max_record_error_rate: 0.25

align:
  tool: mafft
  reference_anchored: true
  codon_aware: true
  mask_gap_frac: 0.90
  chunk_size: 500                # sequences per MAFFT call (each aligned to HXB2 only)

subtype:
  methods: [placement]           # an external second call is planned; until then the
                                 # depositor's label is compared and disagreement reported
  reference_panel: subtype_references.fasta   # LANL subtype reference sequences (you supply)
  min_support: 0.70              # share of site bootstraps that must agree with the call
  n_bootstrap: 100
  exclude_labels: [CPZ, GOR, O, N, P]   # non-M references are not targets
  include_crfs: null             # null = every CRF in the panel; or a list, e.g. [01_AE, 02_AG]
  min_overlap_sites: 300         # comparable sites needed before any call is made
  on_disagreement: report
  tree_min_support: 95.0   # `phylo subtype-tree`: UFBoot % needed on the joining branch

recombination:
  enabled: true
  method: window_scan            # sliding-window subtype scan; a screen, not 3SEQ/RDP
  window: 300                    # alignment columns per window
  step: 100
  min_window_sites: 150
  min_margin: 0.02               # nearest label must beat the next by this p-distance
  min_segment: 400               # columns a same-label run must span to count
  confirm_support: 0.90          # bootstrap support each segment needs for "confirmed"
  tree_policy: exclude_confirmed # exclude_confirmed | exclude_suspected | keep_all
  drm_policy: keep_all           # recombinants always stay in the resistance layer

subsample:
  enabled: true
  strata: [country_code, year_bin, subtype_called]
  year_bin_width: 2
  max_per_stratum: 40
  min_per_stratum: 1
  priority: [date_precision, gene_coverage, ambiguity_frac]
  date_requirement: strict       # strict (day/month) | year (+ year-only, sensitivity) | none

drm:
  algorithm: hivdb
  algorithm_version: null
  classes: [NRTI, NNRTI, PI, INSTI]
  require_gene_coverage: true
  mixtures:
    policy: any
    max_ambiguous_residues: 4     # more possible residues than this = no-call
  sdrm:
    list: sdrm_who.tsv
    list_version: "2009"            # headline: the original WHO 2009 SDRM list
    sensitivity_list: sdrm_stanford_2026-09-25.tsv   # reported separately, never the headline
    sensitivity_list_version: "stanford-2026-09-25"
  cross_check:
    enabled: false
    cache: true
    fail_on_disagreement: true

prevalence:
  strata: [year_bin, drug_class]
  also_by_subtype: true
  by_country: false      # a stratum per country; on for the multi-country Africa profile
  ci_method: wilson
  ci_level: 0.95
  min_stratum_n: 10
  trend_test: cochran_armitage
  study_annotations: study_annotations.tsv   # hand-curated treatment context per study
  year_bin_width: 5               # bins start at multiples of this (2000-2004, 2005-2009, ...)

phylo:
  enabled: true
  tree:
    tool: iqtree2
    model: GTR+F+R4
    model_finder: false
    bootstrap: ufboot
    replicates: 1000
    fast_mode: false
  refine:
    enabled: true
    clock_rate: null
    clock_rate_prior: [0.0008, 0.0030]
    clock_filter_iqd: 4
    date_confidence: true
  temporal_gate:
    enabled: true
    min_temporal_r2: 0.10
    require_positive_slope: true
    date_randomisation: false
    study_randomisation: false   # report a study-level date-shuffle p beside the gate; never fails it
  traits:
    enabled: false   # `phylo traits` is not implemented yet; the DAG leaves the rule out while false
    columns: [country_code, region]
    admin1:
      enabled: auto
      min_resolved_frac: 0.30
  clusters:
    enabled: true
    distance: tn93
    threshold: 0.015
    min_size: 2
    min_overlap: 300         # shared unambiguous sites needed to compare a pair

report:
  min_stratum_n: 10
  include_limitations: true
  figures:
    - prevalence_by_year
    - prevalence_by_class
    - subtype_composition
    - sampling_composition
    - qc_waterfall
    - cluster_size_distribution

logging:
  level: INFO
  json: false
