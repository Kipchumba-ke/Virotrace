# Virotrace base configuration.
# Every analytical parameter lives here. See docs/06-configuration.md.
version: 1
schema_version: 1

scope: kenya
seed: 20261104
threads: 4
snapshot_id: null

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reference: config/reference
  results: results
  auspice: auspice
  reports: reports

scopes:
  kenya:
    countries: [KEN]
    regions: []
  africa:
    countries: []
    regions: [eastern_africa, southern_africa, western_africa, middle_africa, northern_africa]

reference:
  accession: K03455
  record: hxb2.gb
  genes:
    # HXB2 nucleotide coordinates, 1-based inclusive.
    # pol spans 2085-5096 including its terminal stop codon (1004 codons).
    # Integrase is often quoted as 4230-5096, which is 289 codons because it
    # includes that stop. The coding range for the 288-aa protein ends at 5093.
    pol: [2085, 5096]
    pr: [2253, 2549]
    rt: [2550, 4229]
    in: [4230, 5093]

acquire:
  sources: [genbank, lanl]
  min_length: 1000
  max_length: 10000
  email: null
  retries: 3
  cache: true

curate:
  dates:
    min_year: 1985
    max_year: 2026
    allow_year_only: true
  geo:
    country_lookup: country_map.tsv
    require_admin1: false
  dedup:
    identity_threshold: 1.0
    collapse_strategy: keep_best_coverage

qc:
  min_gene_coverage: 0.80
  max_ambiguity_frac: 0.05
  exclude_internal_stop: true
  exclude_frameshift: true
  hypermutation:
    enabled: true
    p_threshold: 0.05
    action: exclude
  exclude_lab_strains: true
  lab_strain_list: lab_strains.txt
  max_record_error_rate: 0.25

align:
  tool: mafft
  reference_anchored: true
  codon_aware: true
  mask_gap_frac: 0.90

subtype:
  methods: [placement, external]
  reference_panel: subtype_references.fasta
  min_support: 0.70
  on_disagreement: report

recombination:
  enabled: true
  method: 3seq
  p_threshold: 0.05
  tree_policy: exclude_confirmed
  drm_policy: keep_all

subsample:
  enabled: true
  strata: [country_code, year_bin, subtype_called]
  year_bin_width: 2
  max_per_stratum: 40
  min_per_stratum: 1
  priority: [date_precision, gene_coverage, ambiguity_frac]

drm:
  algorithm: hivdb
  algorithm_version: null
  classes: [NRTI, NNRTI, PI, INSTI]
  require_gene_coverage: true
  mixtures:
    policy: any
  sdrm:
    list: sdrm_who.tsv
    list_version: "2009"
  cross_check:
    enabled: false
    cache: true
    fail_on_disagreement: true

prevalence:
  strata: [year_bin, drug_class]
  also_by_subtype: true
  ci_method: wilson
  ci_level: 0.95
  min_stratum_n: 10
  trend_test: cochran_armitage

phylo:
  enabled: true
  tree:
    tool: iqtree2
    model: GTR+F+R4
    model_finder: false
    bootstrap: ufboot
    replicates: 1000
    fast_mode: false
  refine:
    enabled: true
    clock_rate: null
    clock_rate_prior: [0.0008, 0.0030]
    clock_filter_iqd: 4
    date_confidence: true
  temporal_gate:
    enabled: true
    min_temporal_r2: 0.10
    require_positive_slope: true
    date_randomisation: false
  traits:
    columns: [country_code, region]
    admin1:
      enabled: auto
      min_resolved_frac: 0.30
  clusters:
    enabled: true
    distance: tn93
    threshold: 0.015
    min_size: 2

report:
  min_stratum_n: 10
  include_limitations: true
  figures:
    - prevalence_by_year
    - prevalence_by_class
    - subtype_composition
    - sampling_composition
    - qc_waterfall
    - cluster_size_distribution

logging:
  level: INFO
  json: false
