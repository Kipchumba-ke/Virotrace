# Context build: Africa-wide. Overnight run on a laptop.
scope: africa
threads: 4

subsample:
  enabled: true
  max_per_stratum: 25

acquire:
  # Add `lanl` once the LANL downloads are in acquire.lanl_path (docs/03-data-acquisition.md).
  sources: [genbank]
  extra_term: 'pol[Gene] OR pol[Title] OR "gag-pol"[Title] OR polyprotein[Title] OR "reverse transcriptase"[Title] OR protease[Title] OR "genomic sequence"[Title] OR "partial genome"[Title] OR "complete genome"[Title] OR "nearly complete"[Title]'

phylo:
  refine:
    subtype_trees: [A1, C, D, G]   # each gets its own temporal gate; pooled Africa trees will not pass
  temporal_gate:
    date_randomisation: true
  tree:
    fast_mode: true
    replicates: 1000
    bootstrap: none          # ufboot needs >= 1000 replicates; too slow on a laptop at this scale

prevalence:
  min_stratum_n: 15
  by_country: true

report:
  min_stratum_n: 15
