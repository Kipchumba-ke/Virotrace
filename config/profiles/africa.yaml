# Context build: Africa-wide. Overnight run on a laptop.
scope: africa
threads: 4

subsample:
  enabled: true
  max_per_stratum: 25

phylo:
  tree:
    fast_mode: true
    replicates: 1000
    bootstrap: none          # ufboot needs >= 1000 replicates; too slow on a laptop at this scale

prevalence:
  min_stratum_n: 15

report:
  min_stratum_n: 15
