name: virotrace
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # orchestration
  - snakemake-minimal>=8.0
  # bioinformatics -- not reliably pip-installable, which is why conda
  - mafft>=7.5
  - iqtree>=2.2
  - treetime>=0.11
  - augur>=24.0
  - auspice>=2.50
  - biopython>=1.83
  # analysis
  - pandas>=2.2
  - numpy>=1.26
  - scipy>=1.12
  - matplotlib>=3.8
  # plumbing
  - pydantic>=2.6
  - pyyaml>=6.0
  - typer>=0.12
  - jinja2>=3.1
  # dev
  - pytest>=8.0
  - pytest-cov>=5.0
  - hypothesis>=6.100
  - ruff>=0.5
  - mypy>=1.10
  - types-pyyaml
  - jsonschema>=4.22
  - pre-commit>=3.7
  - pip
  - pip:
      - pandera>=0.20
      - -e .
