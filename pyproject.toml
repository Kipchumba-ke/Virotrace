[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virotrace"
version = "0.1.0"
description = "HIV-1 drug-resistance and lineage phylogenomic surveillance for Kenya and Africa"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kipchumba" }]
keywords = ["hiv", "bioinformatics", "phylogenetics", "drug-resistance", "nextstrain"]

dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pandas>=2.2",
  "biopython>=1.83",
  "matplotlib>=3.8",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pandera>=0.20",
  "jsonschema>=4.22",
  "pre-commit>=3.7",
  "types-PyYAML",
]

[project.scripts]
virotrace = "virotrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/virotrace"]
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
# typer's decorators are untyped; that is a property of the dependency, not of
# this code, and flagging every CLI command for it drowns the real findings.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "smoke: full dev-profile DAG; slow, excluded from the default run",
  "needs_tools: requires external bioinformatics binaries",
]

[tool.coverage.report]
# Overall coverage percentage is a weak signal; coverage of these three is a strong one.
include = ["src/virotrace/drm/*", "src/virotrace/curate/qc.py", "src/virotrace/curate/subsample.py"]
fail_under = 85
